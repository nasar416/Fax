name = "faxlane-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Runs once a day: resets monthly page cycles, applies fax retention, releases numbers after the 14-day hold.
[triggers]
crons = ["17 3 * * *"]

# Database: SQLite inside a Durable Object (src/db.ts). Free plan; no D1 needed.
[[durable_objects.bindings]]
name = "DATABASE"
class_name = "Database"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Database"]

# Lets src/db.ts import schema.sql as text.
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[[r2_buckets]]
binding = "FAXES"
bucket_name = "faxlane-faxes"                  # create with: npx wrangler r2 bucket create faxlane-faxes

[vars]
BUNDLE_ID = "com.faxlane.app"
PUBLIC_BASE_URL = "https://faxlane-api.faxlane.workers.dev"
# Telnyx Fax Application (connection) ID from the Telnyx portal. Not a secret.
TELNYX_FAX_APP_ID = "3055251109728748786"
# Shared number free users send from (they have no number of their own).
SHARED_FROM_NUMBER = "+16186741234"
# RevenueCat project (not a secret).
REVENUECAT_PROJECT_ID = "proj674c0824"
# Country calling codes users may fax to. Protects against toll fraud.
ALLOWED_DIAL_CODES = "1,44,49,33,39,34,31,32,41,43,45,46,47,48,351,353,358,420,61,64,81,82,852,65,971,966,974,965,973,968,972,90,91,880,92,62,63,60,66,84,55,52,54,56,57,27"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   TELNYX_API_KEY          Telnyx API v2 key (use a key only for Faxlane)
#   TELNYX_PUBLIC_KEY       Telnyx webhook public key (Portal → Account → Keys & Credentials → Public Key)
#   MEDIA_SIGNING_SECRET    any long random string (openssl rand -hex 32)
#   REVENUECAT_SECRET_KEY   RevenueCat → Project settings → API keys → Secret API key, API v2 (sk_...)
#   REVENUECAT_WEBHOOK_AUTH any long random string; the same value goes in the RevenueCat webhook's Authorization header
