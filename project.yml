name: Faxlane
options:
  bundleIdPrefix: com.faxlane
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your Apple Developer Team ID
targets:
  Faxlane:
    type: application
    platform: iOS
    sources:
      - Faxlane
      - Shared
    entitlements:
      path: Faxlane/Faxlane.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        keychain-access-groups: [$(AppIdentifierPrefix)com.faxlane.app]
    info:
      path: Faxlane/Info.plist
      properties:
        CFBundleDisplayName: Faxlane
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Faxlane uses the camera to scan pages you want to fax.
        NSContactsUsageDescription: Faxlane looks for fax numbers in your contacts. Your contacts stay on this iPhone.
        NSFaceIDUsageDescription: Faxlane can ask for Face ID before showing your faxes.
        NSSupportsLiveActivities: true
        # Your Cloudflare Worker URL, e.g. https://faxlane-api.<subdomain>.workers.dev (empty = mock mode)
        FaxlaneAPIBaseURL: ""
        CFBundleLocalizations: [en, ar, cs, nl, fr, de, he, id, it, ja, ko, fa, pl, pt, ru, zh-Hans, es, zh-Hant, tr, vi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faxlane.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: FaxlaneWidgets
  FaxlaneWidgets:
    type: app-extension
    platform: iOS
    sources:
      - FaxlaneWidgets
      - Shared
    info:
      path: FaxlaneWidgets/Info.plist
      properties:
        CFBundleDisplayName: Faxlane
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faxlane.app.widgets
